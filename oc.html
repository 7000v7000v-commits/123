</head>
<body>
  <div class="app">
    <h1>OC訂購金額</h1>
    <div class="hint">
      應訂(x1.2)：係訂 × %數 ÷ 100<br>
      %：實訂 ÷ 係訂 × 100
    </div>

    <div class="storeBox">
      <label for="storeName">店名</label>
      <input
        id="storeName"
        type="text"
        placeholder="輸入店名"
      >
    </div>

    <table>
      <thead>
        <tr>
          <th>品群</th>
          <th>係訂</th>
          <th>應訂(x1.2)<br>%數</th>
          <th>應訂<br>(x1.2)</th>
          <th>實訂</th>
          <th>%</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="totalBox">
      總應訂：<span id="suggestTotal">0</span><br>
      總實訂：<span id="actualTotal">0</span>
    </div>

    <div class="buttons">
      <button onclick="copyResult()">複製結果</button>
      <button class="secondary" onclick="clearAll()">清除</button>
    </div>

    <textarea id="output" class="copyText" placeholder="按「複製結果」後，這裡會產生文字"></textarea>
  </div>

  <script>
    const groups = ["27品群", "28品群", "29品群"];

    function numberFormat(value) {
      if (!isFinite(value)) return "0";
      return Math.round(value).toLocaleString("zh-TW");
    }

    function percentFormat(value) {
      if (!isFinite(value)) return "0%";
      return Math.floor(value) + "%";
    }

    function getTodayTaiwanDate() {
      const now = new Date();
      return new Intl.DateTimeFormat("zh-TW", {
        timeZone: "Asia/Taipei",
        month: "numeric",
        day: "numeric"
      }).format(now);
    }

    function multiplierText(percentInput) {
      const multiplier = percentInput / 100;
      if (!isFinite(multiplier)) return "x0";
      return "x" + multiplier.toFixed(2).replace(/\.?0+$/, "");
    }

    function makeRows() {
      const tbody = document.getElementById("rows");
      tbody.innerHTML = "";

      groups.forEach((group, index) => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td class="cellGroup">${group}</td>
          <td class="cellBase">
            <input
              id="base${index}"
              type="number"
              inputmode="numeric"
              placeholder="輸入"
              oninput="calculate()"
            >
          </td>
          <td class="cellRate">
            <input
              id="percentInput${index}"
              type="number"
              inputmode="decimal"
              step="1"
              placeholder="例150"
              oninput="calculate()"
            >
          </td>
          <td class="suggest cellSuggest" id="suggest${index}">0</td>
          <td class="cellActual">
            <input
              id="actual${index}"
              type="number"
              inputmode="numeric"
              placeholder="實訂"
              oninput="calculate()"
            >
          </td>
          <td class="percent cellPercent" id="actualPercent${index}">0%</td>
        `;

        tbody.appendChild(tr);
      });
    }

    function getValue(id) {
      const value = parseFloat(document.getElementById(id).value);
      return isNaN(value) ? 0 : value;
    }

    function calculate() {
      let suggestTotal = 0;
      let actualTotal = 0;

      groups.forEach((group, index) => {
        const base = getValue(`base${index}`);
        const percentInput = getValue(`percentInput${index}`);
        const actual = getValue(`actual${index}`);

        const suggest = base * percentInput / 100;
        const actualPercent = base > 0 ? actual / base * 100 : 0;

        suggestTotal += suggest;
        actualTotal += actual;

        document.getElementById(`suggest${index}`).textContent = numberFormat(suggest);
        document.getElementById(`actualPercent${index}`).textContent = percentFormat(actualPercent);
      });

      document.getElementById("suggestTotal").textContent = numberFormat(suggestTotal);
      document.getElementById("actualTotal").textContent = numberFormat(actualTotal);
    }

    async function copyResult() {
      calculate();

      const storeName = document.getElementById("storeName").value.trim();
      const today = getTodayTaiwanDate();

      let text = `${today} OC訂購金額\n\n`;
      text += `店名：${storeName || ""}\n\n`;

      groups.forEach((group, index) => {
        const base = getValue(`base${index}`);
        const suggestText = document.getElementById(`suggest${index}`).textContent;
        const actual = getValue(`actual${index}`);
        const actualPercentText = document.getElementById(`actualPercent${index}`).textContent;

        const percentInput = getValue(`percentInput${index}`);
        const multiText = multiplierText(percentInput);

        text += `${group}（係訂/應訂(${multiText})/實訂/%）：\n`;
        text += `${numberFormat(base)} / ${suggestText} / ${numberFormat(actual)} / ${actualPercentText}\n\n`;
      });

      text = text.trim();

      const output = document.getElementById("output");
      output.value = text;
      output.select();

      try {
        await navigator.clipboard.writeText(text);
        alert("已複製結果");
      } catch (e) {
        document.execCommand("copy");
        alert("已產生結果，可手動複製");
      }
    }

    function clearAll() {
      groups.forEach((group, index) => {
        document.getElementById(`base${index}`).value = "";
        document.getElementById(`percentInput${index}`).value = "";
        document.getElementById(`suggest${index}`).textContent = "0";
        document.getElementById(`actual${index}`).value = "";
        document.getElementById(`actualPercent${index}`).textContent = "0%";
      });

      document.getElementById("storeName").value = "";
      document.getElementById("suggestTotal").textContent = "0";
      document.getElementById("actualTotal").textContent = "0";
      document.getElementById("output").value = "";
    }

    makeRows();
    calculate();
  </script>
</body>
