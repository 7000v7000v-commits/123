    .hero p{position:relative;margin:0;color:rgba(255,255,255,.86);font-size:14px;line-height:1.7}
    .nav-wrap{position:sticky;top:0;z-index:50;margin:12px 0;padding:8px;border:1px solid rgba(217,224,234,.9);border-radius:18px;background:rgba(255,255,255,.9);box-shadow:0 8px 25px rgba(45,55,110,.1);backdrop-filter:blur(14px)}

    .tab{min-height:54px;padding:8px 10px;border:1px solid transparent;border-radius:13px;color:#475467;background:#f7f8fb;font-weight:800;cursor:pointer;transition:.16s ease;touch-action:manipulation}
    .tab:hover{border-color:#c7d2fe;background:#eef2ff;color:#3730a3;transform:translateY(-1px)}
    .tab[aria-selected="true"]{color:white;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 8px 20px rgba(79,70,229,.25)}
    .tab-icon{display:block;font-size:20px;line-height:1.1} .tab-label{display:block;margin-top:3px;font-size:13px}
    .panel{display:none;overflow:hidden;border:1px solid rgba(203,213,225,.88);border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
    .panel.active{display:block}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #e8edf4;background:linear-gradient(180deg,#fff,#f8faff)}
    .panel-title{min-width:0} .panel-title h2{margin:0;color:#3730a3;font-size:18px} .panel-title p{margin:3px 0 0;color:var(--muted);font-size:12px}
    .panel-actions{display:flex;gap:8px;flex:0 0 auto}
    .action{min-height:38px;padding:7px 12px;border:1px solid #cdd5e1;border-radius:10px;background:#fff;color:#475467;font-size:13px;font-weight:800;cursor:pointer}
    .action:hover{background:#eef2ff;color:#3730a3;border-color:#a5b4fc}
    .frame-wrap{position:relative;min-height:700px;background:#fff}
    .loader{position:absolute;inset:0;z-index:2;display:grid;place-items:center;align-content:center;gap:10px;color:#667085;background:linear-gradient(180deg,#fff,#f8faff)}
    .spinner{width:34px;height:34px;border:4px solid #e0e7ff;border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
    iframe{display:block;width:100%;min-height:700px;border:0;background:white}
    .foot{margin:14px 0 0;color:#667085;text-align:center;font-size:12px;line-height:1.6}
    @media(max-width:760px){
      .shell{width:calc(100% - 10px);padding-top:6px} .hero{padding:20px 12px;border-radius:18px}
      .nav-wrap{margin:8px 0;padding:6px;border-radius:14px} .tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
      .tab{min-height:50px;padding:7px 6px} .tab-icon{display:inline;margin-right:5px;font-size:17px} .tab-label{display:inline;font-size:12px}
      .panel{border-radius:15px} .panel-head{align-items:flex-start;padding:10px} .panel-title h2{font-size:16px}
      .action{padding:7px 9px;font-size:12px} .frame-wrap,iframe{min-height:760px}
    }
    @media print{.hero,.nav-wrap,.panel-head,.foot{display:none!important}.shell{width:100%;padding:0}.panel{display:none;border:0;box-shadow:none}.panel.active{display:block}}

    const TOOLS = [{"key":"vault","title":"金庫金額表","short":"點錢","icon":"💰"},{"key":"combo","title":"金庫＋送金整合","short":"點錢和文字自行填入","icon":"🔄"},{"key":"remit","title":"送金文字產生器","short":"送金(2)","icon":"📝"},{"key":"oc","title":"OC 訂購金額","short":"OC(1)","icon":"🛒"}];
    const tabs = document.getElementById('tabs');
    const panels = document.getElementById('panels');
    const loaded = new Set();
    let activeKey = '';

    const decodeUtf8 = (b64) => {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    };

    TOOLS.forEach((tool, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tab';
      button.id = `tab-${tool.key}`;
      button.setAttribute('role', 'tab');
      button.setAttribute('aria-controls', `panel-${tool.key}`);
      button.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
      button.innerHTML = `<span class="tab-icon">${tool.icon}</span><span class="tab-label">${tool.title}</span>`;
      button.addEventListener('click', () => showTool(tool.key, true));
      tabs.appendChild(button);

      const section = document.createElement('section');
      section.className = `panel${index === 0 ? ' active' : ''}`;
      section.id = `panel-${tool.key}`;
      section.setAttribute('role', 'tabpanel');
      section.setAttribute('aria-labelledby', button.id);
      section.innerHTML = `
        <div class="panel-head">
          <div class="panel-title"><h2>${tool.icon} ${tool.title}</h2><p>來源：${tool.short}.html</p></div>
          <div class="panel-actions">
            <button type="button" class="action reload" data-key="${tool.key}">重新載入</button>
            <button type="button" class="action top-btn">回頂端</button>
          </div>
        </div>
        <div class="frame-wrap">
          <div class="loader" id="loader-${tool.key}"><span class="spinner"></span><span>正在載入工具…</span></div>
          <iframe id="frame-${tool.key}" title="${tool.title}" loading="eager" allow="clipboard-read; clipboard-write"></iframe>
        </div>`;
      panels.appendChild(section);
    });

    document.querySelectorAll('.reload').forEach(btn => btn.addEventListener('click', () => mount(btn.dataset.key, true)));
    document.querySelectorAll('.top-btn').forEach(btn => btn.addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'})));

    function resizeFrame(frame) {
      if (!frame) return;
      try {
        const doc = frame.contentDocument;
        if (!doc) return;
        const body = doc.body, root = doc.documentElement;
        const height = Math.max(
          body ? body.scrollHeight : 0, body ? body.offsetHeight : 0,
          root ? root.scrollHeight : 0, root ? root.offsetHeight : 0,
          700
        );
        const current = frame.getBoundingClientRect().height || 700;
        // Only grow when real content exceeds the viewport. This avoids a 100vh resize loop.
        if (height > current + 24) frame.style.height = Math.min(height, 12000) + 'px';
      } catch (_) { frame.style.height = '1200px'; }
    }

    function bindAutoResize(frame) {
      try {
        const doc = frame.contentDocument;
        if (!doc || doc.__indexResizeBound) return;
        doc.__indexResizeBound = true;
        ['input','change','click','keyup'].forEach(evt => doc.addEventListener(evt, () => setTimeout(() => resizeFrame(frame), 80), true));
        if ('ResizeObserver' in window) {
          const ro = new ResizeObserver(() => resizeFrame(frame));
          if (doc.documentElement) ro.observe(doc.documentElement);
          if (doc.body) ro.observe(doc.body);
          frame.__resizeObserver = ro;
        }
      } catch (_) {}
    }

    function mount(key, force = false) {
      const frame = document.getElementById(`frame-${key}`);
      const loader = document.getElementById(`loader-${key}`);
      if (!frame || (!force && loaded.has(key))) { resizeFrame(frame); return; }
      loader.style.display = 'grid';
      frame.onload = () => {
        loaded.add(key);
        loader.style.display = 'none';
        resizeFrame(frame);
        bindAutoResize(frame);
        [150, 500, 1200, 2500].forEach(ms => setTimeout(() => resizeFrame(frame), ms));
      };
      frame.srcdoc = decodeUtf8(PAGE_DATA[key]);
    }

    function showTool(key, updateHash = false) {
      if (!TOOLS.some(t => t.key === key)) key = TOOLS[0].key;
      activeKey = key;
      TOOLS.forEach(tool => {
        const selected = tool.key === key;
        document.getElementById(`tab-${tool.key}`).setAttribute('aria-selected', selected ? 'true' : 'false');
        document.getElementById(`panel-${tool.key}`).classList.toggle('active', selected);
      });
      mount(key);
      if (updateHash) history.replaceState(null, '', `#${key}`);
      setTimeout(() => resizeFrame(document.getElementById(`frame-${key}`)), 50);
    }

    window.addEventListener('hashchange', () => showTool(location.hash.slice(1), false));
    window.addEventListener('resize', () => { clearTimeout(window.__indexResizeTimer); window.__indexResizeTimer = setTimeout(() => resizeFrame(document.getElementById(`frame-${activeKey}`)), 160); });

    showTool(location.hash.slice(1) || TOOLS[0].key, false);
  })();
  </script>
