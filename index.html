<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<title>元氣店務工具</title>
<style>
*{box-sizing:border-box}
:root{--text:#172554;--muted:#64748b;--line:#dbeafe;--card:#fff}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--text);background:linear-gradient(145deg,#eff6ff,#faf5ff 55%,#fff7ed)}
main{width:min(760px,calc(100% - 24px));margin:auto;padding:24px 0 42px}
.hero{padding:24px 18px;border-radius:24px;color:white;text-align:center;background:linear-gradient(125deg,#1d4ed8,#7c3aed,#db2777);box-shadow:0 14px 32px rgba(79,70,229,.20)}
h1{margin:0 0 8px;font-size:clamp(28px,7vw,40px);letter-spacing:.04em}.hero p{margin:0;color:rgba(255,255,255,.86);font-size:14px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
a.card{display:block;min-height:136px;padding:18px;text-decoration:none;color:inherit;border:1px solid rgba(203,213,225,.8);border-radius:20px;background:rgba(255,255,255,.96);box-shadow:0 9px 24px rgba(30,64,175,.08);transition:transform .12s ease,box-shadow .12s ease}
a.card:active{transform:scale(.985)}.icon{font-size:28px}.title{margin:10px 0 5px;font-size:19px;font-weight:900}.desc{color:var(--muted);font-size:13px;line-height:1.5}
.primary{grid-column:1/-1;background:linear-gradient(135deg,#eef2ff,#fdf2f8)!important;border-color:#c4b5fd!important}.primary .title{font-size:22px;color:#4c1d95}
.footer{margin-top:18px;text-align:center;color:#64748b;font-size:12px;line-height:1.6}
@media(max-width:540px){main{width:calc(100% - 14px);padding-top:8px}.hero{padding:20px 14px;border-radius:18px}.grid{grid-template-columns:1fr;gap:9px}.primary{grid-column:auto}a.card{min-height:0;padding:15px;border-radius:16px}.icon{font-size:24px}.title{margin:7px 0 3px;font-size:18px}.primary .title{font-size:20px}}
</style>
</head>
<body>
<main>
  <header class="hero">
    <h1>元氣店務工具</h1>
    <p>首頁只放工具入口；點選後才載入該工具，手機開啟更輕快。</p>
  </header>
  <section class="grid" aria-label="工具列表">
    <a class="card primary" href="combo.html"><div class="icon">💰</div><div class="title">金庫＋送金整合</div><div class="desc">金庫在上、送金在下，保留自動同步與計算。</div></a>
    <a class="card" href="vault.html"><div class="icon">🧮</div><div class="title">金庫金額表</div><div class="desc">單獨開啟金庫、硬幣、紙鈔與預捉統計。</div></a>
    <a class="card" href="remit.html"><div class="icon">✨</div><div class="title">送金文字產生器</div><div class="desc">單獨填寫送金資料、預覽與複製文字。</div></a>
    <a class="card" href="friendly.html"><div class="icon">🌈</div><div class="title">元氣金額輸入</div><div class="desc">快速輸入指定時段與合計金額。</div></a>
    <a class="card" href="oc.html"><div class="icon">🛒</div><div class="title">OC 訂購金額</div><div class="desc">訂購金額試算與文字整理。</div></a>
  </section>
  <div class="footer">GitHub Pages：請把這 6 個 HTML 放在同一層目錄。</div>
</main>
</body>
</html>
